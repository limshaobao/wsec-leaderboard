<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WSEC UK League Table</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .wrap {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th {
      background: #111;
      color: white;
      padding: 10px;
      text-align: left;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    tr:hover {
      background: #f6f6f6;
    }

    a {
      text-decoration: none;
      color: #1a73e8;
    }

    a:hover {
      text-decoration: underline;
    }

    select {
      padding: 8px;
      margin-bottom: 10px;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>2026 WS European Championship - UK League Table</h1>

  <div id="shopFilter"></div>
  <div id="leaderboard">Loading...</div>

</div>

<script>
let allPlayers = [];
let shopData = {};
let currentShop = "GLOBAL";

fetch("https://script.google.com/macros/s/AKfycbzuWLCBe3q12dR8zlRYmUx0QWCutjMZvaUlnkb887jTMd_8pEdE1BN30fp5RUXPCFuA1Q/exec")
  .then(res => res.json())
  .then(data => {

    allPlayers = data.players;
    shopData = data.shops;

    renderLeaderboard();
    buildShopDropdown();
  });

function buildShopDropdown() {
  const shops = Object.keys(shopData);

  let html = `<select id="shopSelect" onchange="changeShop()">`;
  html += `<option value="GLOBAL">Global Leaderboard</option>`;

  shops.forEach(s => {
    html += `<option value="${s}">${s}</option>`;
  });

  html += `</select>`;

  document.getElementById("shopFilter").innerHTML = html;
}

function changeShop() {
  currentShop = document.getElementById("shopSelect").value;
  renderLeaderboard();
}

  function renderLeaderboard() {

  let list = [];

  if (currentShop === "GLOBAL") {
    list = allPlayers;
  } else {
    list = shopData[currentShop].leaderboard;
  }

  let html = `
    <table>
      <tr>
        <th>Rank</th>
        <th>Player</th>
        <th>Points</th>
        <th>Episodes</th>
      </tr>
  `;

  // -----------------------------
  // ONLY GLOBAL NEEDS COMPLEX LOGIC
  // -----------------------------
  if (currentShop === "GLOBAL") {

    const shopWinners = new Set();

Object.values(shopData).forEach(shop => {

  if (shop.finalWinner) {
    shopWinners.add(shop.finalWinner);
  }
});

    const top16 = [];
    const rest = [];

    list.forEach(p => {

      if (p.globalRank === 1) return;

      if (shopWinners.has(p.player)) {
        return;
      }

      top16.push(p);
    });

    // sort top16 by global rank (stable)
    top16.sort((a, b) => a.globalRank - b.globalRank);

    const blueGroup = top16.slice(0, 16);

    const blueSet = new Set(blueGroup.map(p => p.player));

    list.forEach(p => {

      const rank = p.globalRank;
      const points = p.totalPoints.toFixed(1);
      const episodes = p.episodesPlayed ?? "-";

      let style = "";

      // 🥇 GLOBAL #1
      if (rank === 1) {
        style = "background:#ffd700; font-weight:bold;";
      }

      // 🟩 SHOP WINNERS (excluding global #1)
      else if (shopWinners.has(p.player)) {
        style = "background:#b6fcb6; font-weight:bold;";
      }

      // 🟦 DYNAMIC BLUE RANGE (next 16 after exclusions)
      else if (blueSet.has(p.player)) {
        style = "background:#cfe8ff;";
      }

      html += `
        <tr style="${style}">
          <td>${rank}</td>
          <td>
            <a href="./player.html?player=${encodeURIComponent(p.player)}">
              ${p.player}
            </a>
          </td>
          <td>${points}</td>
          <td>${episodes}</td>
        </tr>
      `;
    });

  }

  // -----------------------------
  // SHOP VIEW (UNCHANGED LOGIC)
  // -----------------------------
  else {

    list.forEach(p => {

      const rank = p.shopRank;
      const points = p.totalPoints.toFixed(1);

      let style = "";

      // 🟩 display/inherited winner
      if (p.player === shopData[currentShop].finalWinner) {
        style = "background:#b6fcb6; font-weight:bold;";
      }
      
      // optional: outline true top scorer if displaced
      else if (
        rank === 1 &&
        p.player !== shopData[currentShop].finalWinner
      ) {
        style = "border:2px solid #ffd700;";
      }

      html += `
        <tr style="${style}">
          <td>${rank}</td>
          <td>${p.player}</td>
          <td>${points}</td>
          <td>-</td>
        </tr>
      `;
    });
  }

  html += `</table>`;

  document.getElementById("leaderboard").innerHTML = html;
}
</script>

</body>
</html>
