<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WSEC UK League Table</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .wrap {
      max-width: 900px;
      margin: 30px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 15px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background: #111;
      color: white;
      padding: 12px;
      text-align: left;
      cursor: pointer;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    tr:hover {
      background: #f6f6f6;
    }

    .rank-1 {
      background: linear-gradient(90deg, gold, #fff6cc);
    }

    .rank-top16 {
      background: #dff5df;
    }

    a {
      color: #1a73e8;
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    .subtext {
      font-size: 12px;
      color: #777;
      margin-top: 4px;
    }
  </style>
</head>

<body>

<div class="wrap">
  <h1>WSEC UK League Table</h1>
  <div id="table">Loading...</div>
</div>

<script>
let rows = [];

fetch("https://script.google.com/macros/s/AKfycbzuWLCBe3q12dR8zlRYmUx0QWCutjMZvaUlnkb887jTMd_8pEdE1BN30fp5RUXPCFuA1Q/exec")
  .then(res => res.json())
  .then(data => {

    rows = data.best5_table;

    // clean invalid data
    rows = rows.filter(r =>
      r.player &&
      !isNaN(parseFloat(r.points))
    );

    render(rows);
  });

function render(data) {

  data.sort((a,b) => parseFloat(b.points) - parseFloat(a.points));

  let html = `
    <table>
      <tr>
        <th>Rank</th>
        <th>Player</th>
        <th>Points</th>
        <th>Episodes</th>
      </tr>
  `;

  data.forEach((r, i) => {

    const points = parseFloat(r.points).toFixed(2);
    const slug = r.player.toLowerCase().replace(/\s+/g,'-');

    let cls = "";
    if (i === 0) cls = "rank-1";
    else if (i < 16) cls = "rank-top16";

    html += `
      <tr class="${cls}">
        <td>${i+1}</td>

        <td>
        <a href="https://limshaobao.github.io/wsec-leaderboard/player.html?player=${encodeURIComponent(r.player)}">
            ${r.player}
          </a>
          <div class="subtext">View profile</div>
        </td>

        <td>${points}</td>
        <td>${r.episodes}</td>
      </tr>
    `;
  });

  html += "</table>";

  document.getElementById("table").innerHTML = html;
}
</script>

</body>
</html>
