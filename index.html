<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WSEC UK League Table</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .wrap {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th {
      background: #111;
      color: white;
      padding: 10px;
      text-align: left;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    tr:hover {
      background: #f6f6f6;
    }

    a {
      text-decoration: none;
      color: #1a73e8;
    }

    a:hover {
      text-decoration: underline;
    }

    select {
      padding: 8px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .shop-button {
      display: none;
      background: #005bbb;
      color: white !important;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .shop-button:hover {
      background: #004799;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>2026 WS European Championship - UK League Table</h1>

  <div id="shopFilter"></div>

  <div style="margin:15px 0;">

    <a
      id="shopPageLink"
      class="shop-button"
      href="#"
      target="_blank"
    >
      Open Full Shop Page
    </a>

  </div>

  <div id="leaderboard">Loading...</div>

</div>

<script>

let allPlayers = [];
let shopData = {};
let currentShop = "GLOBAL";

fetch("https://script.google.com/macros/s/AKfycbzuWLCBe3q12dR8zlRYmUx0QWCutjMZvaUlnkb887jTMd_8pEdE1BN30fp5RUXPCFuA1Q/exec")
  .then(response => response.text())
  .then(text => JSON.parse(text))
  .then(data => {

    allPlayers = data.players;
    shopData = data.shops;

    buildShopDropdown();
    renderLeaderboard();
  });

function buildShopDropdown() {

  const shops = Object.keys(shopData);

  let html = `
    <select id="shopSelect" onchange="changeShop()">
  `;

  html += `
    <option value="GLOBAL">Global Leaderboard</option>
  `;

  shops.forEach(s => {
    html += `<option value="${s}">${s}</option>`;
  });

  html += `</select>`;

  document.getElementById("shopFilter").innerHTML = html;
}

function changeShop() {
  currentShop = document.getElementById("shopSelect").value;
  renderLeaderboard();
}

function renderLeaderboard() {

  const shopLink = document.getElementById("shopPageLink");

  if (currentShop !== "GLOBAL") {
    shopLink.style.display = "inline-block";
    shopLink.href = "./shop.html?shop=" + encodeURIComponent(currentShop);
  } else {
    shopLink.style.display = "none";
  }

  let list = currentShop === "GLOBAL"
    ? allPlayers
    : shopData[currentShop].leaderboard;

  let html = `
    <table>
      <tr>
        <th>Rank</th>
        <th>Player</th>
        <th>Points</th>
        <th>Episodes</th>
      </tr>
  `;

  // =====================================================
  // GLOBAL VIEW (UNCHANGED LOGIC)
  // =====================================================
  if (currentShop === "GLOBAL") {

    const shopWinners = new Set();

    Object.values(shopData).forEach(shop => {
      if (shop.finalWinner) shopWinners.add(shop.finalWinner);
    });

    const blueSet = new Set();

    Object.values(shopData).forEach(shop => {

      const leaderboard = (shop.leaderboard || [])
        .slice()
        .sort((a, b) => (a.shopRank || 999) - (b.shopRank || 999));

      const winner = shop.finalWinner;
      const pool = leaderboard.filter(p => p.player !== winner);

      const blue1 = pool[1];
      const blue2 = pool[2];

      if (blue1) blueSet.add(blue1.player);
      if (blue2) blueSet.add(blue2.player);
    });

    list.forEach(p => {

      const rank = p.globalRank;
      const points = Number(p.totalPoints).toFixed(1);
      const episodes = p.episodesPlayed ?? "-";

      let style = "";

      if (rank === 1) {
        style = "background:#ffd700;font-weight:bold;";
      }
      else if (shopWinners.has(p.player)) {
        style = "background:#b6fcb6;font-weight:bold;";
      }
      else if (blueSet.has(p.player)) {
        style = "background:#cfe8ff;";
      }

      html += `
        <tr style="${style}">
          <td>${rank}</td>
          <td>
            <a href="./player_v2.html?player=${encodeURIComponent(p.player)}">
              ${p.player}
            </a>
          </td>
          <td>${points}</td>
          <td>${episodes}</td>
        </tr>
      `;
    });
  }

  // =====================================================
  // SHOP VIEW (FIXED CASCADE SHIFT LOGIC)
  // =====================================================
  else {

    const shop = shopData[currentShop];

    const leaderboard = (shop.leaderboard || [])
      .slice()
      .sort((a, b) => (a.shopRank || 999) - (b.shopRank || 999));

    const winner = shop.finalWinner;

    const globalWinner =
      allPlayers.find(p => p.globalRank === 1)?.player;

    const winnerIsGlobalGold = (winner === globalWinner);

    // ----------------------------
    // BASE RULES
    // ----------------------------
    let greenIndex = 0;
    let blueStart = 1;

    // ----------------------------
    // CASCADE SHIFT RULE
    // ONLY if shop winner = global #1
    // ----------------------------
    if (winnerIsGlobalGold) {
      greenIndex = 1; // rank 2 becomes green
      blueStart = 2;  // ranks 3–4 become blue
    }

    const greenPlayer = leaderboard[greenIndex];

    const blueSet = new Set();
    if (leaderboard[blueStart]) blueSet.add(leaderboard[blueStart].player);
    if (leaderboard[blueStart + 1]) blueSet.add(leaderboard[blueStart + 1].player);

    list.forEach(p => {

      const rank = p.shopRank;
      const points = Number(p.totalPoints).toFixed(1);
      const episodes = p.episodesPlayed ?? "-";

      let style = "";

      // 🟩 GREEN (dynamic)
      if (greenPlayer && p.player === greenPlayer.player) {
        style = "background:#b6fcb6;font-weight:bold;";
      }

      // 🟦 BLUE (dynamic)
      else if (blueSet.has(p.player)) {
        style = "background:#cfe8ff;";
      }

      html += `
        <tr style="${style}">
          <td>${rank}</td>
          <td>
            <a href="./player_v2.html?player=${encodeURIComponent(p.player)}">
              ${p.player}
            </a>
          </td>
          <td>${points}</td>
          <td>${episodes}</td>
        </tr>
      `;
    });
  }

  html += `</table>`;
  document.getElementById("leaderboard").innerHTML = html;
}

</script>

</body>
</html>
