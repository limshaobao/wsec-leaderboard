<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>WSEC UK League Table</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    .wrap {
      max-width: 1000px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }

    th {
      background: #111;
      color: white;
      padding: 10px;
      text-align: left;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #eee;
    }

    tr:hover {
      background: #f6f6f6;
    }

    a {
      text-decoration: none;
      color: #1a73e8;
    }

    a:hover {
      text-decoration: underline;
    }

    select {
      padding: 8px;
      margin-bottom: 10px;
      font-size: 14px;
    }

    .shop-button {
      display: none;
      background: #005bbb;
      color: white !important;
      padding: 10px 18px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .shop-button:hover {
      background: #004799;
      text-decoration: none;
    }
  </style>
</head>

<body>

<div class="wrap">

  <h1>2026 WS European Championship - UK League Table</h1>

  <div id="shopFilter"></div>

  <div style="margin:15px 0;">

    <a
      id="shopPageLink"
      class="shop-button"
      href="#"
      target="_blank"
    >
      Open Full Shop Page
    </a>

  </div>

  <div id="leaderboard">Loading...</div>

</div>

<script>

let allPlayers = [];
let shopData = {};
let currentShop = "GLOBAL";

fetch("https://script.google.com/macros/s/AKfycbzuWLCBe3q12dR8zlRYmUx0QWCutjMZvaUlnkb887jTMd_8pEdE1BN30fp5RUXPCFuA1Q/exec")
  .then(response => response.text())
  .then(text => JSON.parse(text))
  .then(data => {

    allPlayers = data.players;
    shopData = data.shops;

    buildShopDropdown();
    renderLeaderboard();
  });

function buildShopDropdown() {

  const shops = Object.keys(shopData);

  let html = `
    <select id="shopSelect" onchange="changeShop()">
  `;

  html += `
    <option value="GLOBAL">Global Leaderboard</option>
  `;

  shops.forEach(s => {
    html += `<option value="${s}">${s}</option>`;
  });

  html += `</select>`;

  document.getElementById("shopFilter").innerHTML = html;
}

function changeShop() {
  currentShop = document.getElementById("shopSelect").value;
  renderLeaderboard();
}

function renderLeaderboard() {

  const shopLink = document.getElementById("shopPageLink");

  if (currentShop !== "GLOBAL") {
    shopLink.style.display = "inline-block";
    shopLink.href = "./shop.html?shop=" + encodeURIComponent(currentShop);
  } else {
    shopLink.style.display = "none";
  }

  let list = currentShop === "GLOBAL"
    ? allPlayers
    : shopData[currentShop].leaderboard;

  let html = `
    <table>
      <tr>
        <th>Rank</th>
        <th>Player</th>
        <th>Points</th>
        <th>Episodes</th>
      </tr>
  `;

  // =====================================================
  // GLOBAL VIEW
  // =====================================================
  if (currentShop === "GLOBAL") {

    const shopWinners = new Set();

    Object.values(shopData).forEach(shop => {
    
      const ui = shop.ui || {};
    
      if (ui.greenPlayer) {
        shopWinners.add(ui.greenPlayer);
      }
    });

    const blueSet = new Set();

    Object.values(shopData).forEach(shop => {

      const ui = shop.ui || {};

      (ui.bluePlayers || []).forEach(player => {
        blueSet.add(player);
      });
    });

    list.forEach(p => {

      const rank = p.globalRank;
      const points = Number(p.totalPoints).toFixed(1);
      const episodes = p.episodesPlayed ?? "-";

      let style = "";

      // 🥇 GLOBAL WINNER
      if (rank === 1) {
        style = "background:#ffd700;font-weight:bold;";
      }

      // 🟩 SHOP WINNERS
      else if (shopWinners.has(p.player)) {
        style = "background:#b6fcb6;font-weight:bold;";
      }

      // 🟦 QUALIFIERS
      else if (blueSet.has(p.player)) {
        style = "background:#cfe8ff;";
      }

      html += `
        <tr style="${style}">
          <td>${rank}</td>

          <td>
            <a href="./player_v2.html?player=${encodeURIComponent(p.player)}">
              ${p.player}
            </a>
          </td>

          <td>${points}</td>
          <td>${episodes}</td>
        </tr>
      `;
    });
  }

  // =====================================================
  // SHOP VIEW
  // =====================================================
  else {

    const shop = shopData[currentShop];
    const ui = shop.ui || {};

    const greenPlayer = ui.greenPlayer;
    const bluePlayers = new Set(ui.bluePlayers || []);

    const globalWinner =
      allPlayers.find(p => p.globalRank === 1)?.player;

    list.forEach(p => {

      const rank = p.shopRank;
      const points = Number(p.totalPoints).toFixed(1);
      const episodes = p.episodesPlayed ?? "-";

      let style = "";

      // 🥇 GLOBAL #1 ALWAYS GOLD
      if (p.player === globalWinner) {
        style = "background:#ffd700;font-weight:bold;";
      }

      // 🟩 GREEN SLOT
      else if (p.player === greenPlayer) {
        style = "background:#b6fcb6;font-weight:bold;";
      }

      // 🟦 BLUE SLOTS
      else if (bluePlayers.has(p.player)) {
        style = "background:#cfe8ff;";
      }

      html += `
        <tr style="${style}">
          <td>${rank}</td>

          <td>
            <a href="./player_v2.html?player=${encodeURIComponent(p.player)}">
              ${p.player}
            </a>
          </td>

          <td>${points}</td>
          <td>${episodes}</td>
        </tr>
      `;
    });
  }

  html += `</table>`;

  document.getElementById("leaderboard").innerHTML = html;
}

</script>

</body>
</html>
