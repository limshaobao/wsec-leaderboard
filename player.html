<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Player Profile</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
    }

    .wrap {
      max-width: 700px;
      margin: 40px auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 10px;
    }

    .stat {
      padding: 12px 0;
      border-bottom: 1px solid #eee;
      font-size: 16px;
    }

    .back {
      display: inline-block;
      margin-top: 15px;
      color: #1a73e8;
      text-decoration: none;
    }

    .back:hover {
      text-decoration: underline;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: #eee;
      border-radius: 6px;
      font-size: 12px;
      margin-left: 8px;
    }
  </style>
</head>

<body>

<div class="wrap">
  <h1 id="name">Loading...</h1>

  <div id="stats">Loading stats...</div>

  <a class="back" href="./index.html">← Back to leaderboard</a>
</div>

<script>
function getPlayer() {
  const params = new URLSearchParams(window.location.search);
  return params.get("player");
}

const player = getPlayer();

if (!player) {
  document.getElementById("name").innerText = "No player selected";
} else {

  fetch("https://script.google.com/macros/s/AKfycbzuWLCBe3q12dR8zlRYmUx0QWCutjMZvaUlnkb887jTMd_8pEdE1BN30fp5RUXPCFuA1Q/exec?player=" + encodeURIComponent(player))
    .then(res => res.json())
    .then(data => {

      const rows = data.best5_table;

      document.getElementById("name").innerText = player;

      if (!rows || rows.length === 0) {
        document.getElementById("stats").innerHTML =
          "<div class='stat'>No data found for this player.</div>";
        return;
      }

      // ----------------------------
      // CALCULATIONS
      // ----------------------------

      let total = 0;
      let best = 0;
      let episodes = rows.length;

      rows.forEach(r => {
        const p = parseFloat(r.points);
        if (!isNaN(p)) {
          total += p;
          if (p > best) best = p;
        }
      });

      let avg = total / episodes;

      // ----------------------------
      // UI OUTPUT
      // ----------------------------

      document.getElementById("stats").innerHTML = `
        <div class="stat">
          <b>Total Points:</b> ${total.toFixed(2)}
        </div>

        <div class="stat">
          <b>Episodes Played:</b> ${episodes}
        </div>

        <div class="stat">
          <b>Best Score:</b> ${best.toFixed(2)}
        </div>

        <div class="stat">
          <b>Average Score:</b> ${avg.toFixed(2)}
        </div>
      `;
    })
    .catch(err => {
      document.getElementById("stats").innerHTML =
        "<div class='stat'>Failed to load data.</div>";
    });
}
</script>

</body>
</html>
