<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Player Profile</title>

<style>
body {
  font-family: Arial;
  background: #f5f5f5;
  padding: 20px;
}

.wrap {
  max-width: 900px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
}

.card {
  padding: 12px;
  margin-bottom: 10px;
  border: 1px solid #eee;
  border-radius: 8px;
}

h2 { margin-top: 0; }

.shop-title {
  margin-top: 20px;
  font-weight: bold;
  background: #eee;
  padding: 8px;
}

.row {
  padding: 6px 0;
  border-bottom: 1px solid #f0f0f0;
}

.small {
  color: #666;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="wrap">
  <h2 id="name">Loading...</h2>

  <div id="summary"></div>
  <div id="shops"></div>
  <div id="episodes"></div>
</div>

<script>

const urlParams = new URLSearchParams(window.location.search);
const playerName = urlParams.get("player");

fetch("https://script.google.com/macros/s/AKfycbzuWLCBe3q12dR8zlRYmUx0QWCutjMZvaUlnkb887jTMd_8pEdE1BN30fp5RUXPCFuA1Q/exec?player=" + encodeURIComponent(playerName))
  .then(res => res.json())
  .then(data => {

    const p = data.player;

    if (!p) {
      document.getElementById("name").innerText = "Player not found";
      return;
    }

    document.getElementById("name").innerText = p.player;

    // -------------------------
    // SUMMARY CARD
    // -------------------------
    document.getElementById("summary").innerHTML = `
      <div class="card">
        <b>Global Rank:</b> ${p.globalRank}<br>
        <b>Total Points:</b> ${p.totalPoints.toFixed(1)}<br>
        <b>Best Score:</b> ${p.bestScore.toFixed(1)}<br>
        <b>Episodes Played:</b> ${p.episodesPlayed}
      </div>
    `;

    // -------------------------
    // SHOP BREAKDOWN
    // -------------------------
    const shopTotals = {};

    p.episodes.forEach(e => {
      if (!shopTotals[e.shop]) {
        shopTotals[e.shop] = 0;
      }
      shopTotals[e.shop] += e.points;
    });

    let shopHTML = `<div class="card"><h3>Shop Performance</h3>`;

    Object.keys(shopTotals).forEach(shop => {
      shopHTML += `
        <div class="row">
          ${shop}: ${shopTotals[shop].toFixed(1)} pts
        </div>
      `;
    });

    shopHTML += `</div>`;

    document.getElementById("shops").innerHTML = shopHTML;

    // -------------------------
    // EPISODE TIMELINE
    // -------------------------
    const grouped = {};

    p.episodes.forEach(e => {
      if (!grouped[e.shop]) grouped[e.shop] = [];
      grouped[e.shop].push(e);
    });

    let html = `<div class="card"><h3>Episode History</h3>`;

    Object.keys(grouped).forEach(shop => {

      html += `<div class="shop-title">${shop}</div>`;

      grouped[shop].forEach(e => {

        html += `
          <div class="row">
            <b>${e.episode}</b> —
            Set: ${e.set || "-"} —
            ${e.points.toFixed(1)} pts
            <div class="small">
              ${e.comment || ""}
            </div>
          </div>
        `;
      });
    });

    html += `</div>`;

    document.getElementById("episodes").innerHTML = html;
  });

</script>

</body>
</html>
